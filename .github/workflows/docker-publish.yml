name: Build and publish

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'common/**'
      - 'platform/**'
      - 'sdk/**'

env:
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      options: --privileged

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Login to GHCR
        run: echo "${{ env.REGISTRY_PASSWORD }}" | podman login ghcr.io --username "${{ env.REGISTRY_USER }}" --password-stdin

      - name: Build platform images
        shell: bash
        run: |
          set -euo pipefail
          source platform/ubuntu.env

          build() {
            podman build --format oci --pull=never --timestamp "$PLATFORM_EPOCH" --file "$2" --tag "ghcr.io/containerpak/$1:main" .
          }

          podman pull "$UBUNTU_IMAGE"
          podman build \
            --format oci \
            --pull=never \
            --squash-all \
            --timestamp "$PLATFORM_EPOCH" \
            --build-arg "UBUNTU_IMAGE=$UBUNTU_IMAGE" \
            --build-arg "UBUNTU_SNAPSHOT=$UBUNTU_SNAPSHOT" \
            --label "io.containerpak.platform.version=$PLATFORM_VERSION" \
            --label "io.containerpak.locale.image=ghcr.io/containerpak/locales:ubuntu-$PLATFORM_VERSION" \
            --label "io.containerpak.ubuntu.image=$UBUNTU_IMAGE" \
            --label "io.containerpak.ubuntu.snapshot=$UBUNTU_SNAPSHOT" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file platform/foundation/Containerfile \
            --tag ghcr.io/containerpak/foundation:main \
            .
          test "$(podman image inspect --format '{{len .RootFS.Layers}}' ghcr.io/containerpak/foundation:main)" -eq 1
          build base platform/base/Containerfile
          podman run --rm ghcr.io/containerpak/base:main test -s /etc/ssl/certs/ca-certificates.crt
          podman run --rm ghcr.io/containerpak/base:main grep -Fqx "APT::Snapshot \"$UBUNTU_SNAPSHOT\";" /etc/apt/apt.conf.d/50cpak-snapshot
          podman run --rm ghcr.io/containerpak/base:main test -s /usr/share/doc/apt/copyright
          podman run --rm ghcr.io/containerpak/base:main test -d /usr/share/man/man1
          podman run --rm ghcr.io/containerpak/base:main sh -c '! grep -rq "^path-exclude=/usr/share/locale/" /etc/dpkg/dpkg.cfg.d'
          podman run --rm ghcr.io/containerpak/base:main sh -c 'apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install --reinstall -y apt >/dev/null && test -n "$(find /usr/share/locale -name apt.mo -print -quit)"'
          test -z "$(podman run --rm ghcr.io/containerpak/base:main find /usr/share/doc -type f ! -name copyright -print -quit)"
          test "$(podman image inspect --format '{{len .RootFS.Layers}}' ghcr.io/containerpak/base:main)" -eq 1
          build locales platform/locales/Containerfile
          locale_container="$(podman create ghcr.io/containerpak/locales:main true)"
          podman export "$locale_container" | tar -tf - | grep -Fx usr/lib/locale/pt_BR.utf8/LC_CTYPE >/dev/null
          podman rm "$locale_container"
          build mesa64 platform/mesa64/Containerfile
          build mesa-multilib platform/mesa-multilib/Containerfile
          build mesa platform/mesa/Containerfile
          build gtk3 platform/gtk3/Containerfile
          build gtk4 platform/gtk4/Containerfile
          build adwaita platform/adwaita/Containerfile
          build webkitgtk platform/webkitgtk/Containerfile
          build webkitgtk6 platform/webkitgtk6/Containerfile
          build desktop platform/desktop/Containerfile
          build gtk platform/gtk/Containerfile
          test "$(podman image inspect --format '{{json .RootFS.Layers}}' ghcr.io/containerpak/desktop:main)" = \
            "$(podman image inspect --format '{{json .RootFS.Layers}}' ghcr.io/containerpak/gtk:main)"

      - name: Publish platform images
        shell: bash
        run: |
          set -euo pipefail
          source platform/ubuntu.env

          images=(foundation base locales mesa64 mesa-multilib mesa gtk3 gtk4 adwaita webkitgtk webkitgtk6 desktop gtk)
          revision="sha-${GITHUB_SHA::12}"
          release="ubuntu-$PLATFORM_VERSION"

          for image in "${images[@]}"; do
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:$revision"
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:$release"
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:ubuntu-26.04"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:$revision"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:$release"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:ubuntu-26.04"
          done

          for image in "${images[@]}"; do
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:main"
          done

  sdk:
    needs: platform
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      options: --privileged

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Login to GHCR
        run: echo "${{ env.REGISTRY_PASSWORD }}" | podman login ghcr.io --username "${{ env.REGISTRY_USER }}" --password-stdin

      - name: Build SDK images
        shell: bash
        run: |
          set -euo pipefail
          source platform/ubuntu.env

          build() {
            podman build --format oci --pull=never --timestamp "$PLATFORM_EPOCH" --file "$2" --tag "ghcr.io/containerpak/$1:main" .
          }

          podman pull ghcr.io/containerpak/base:main
          build base-sdk sdk/base/Containerfile
          build mesa64-sdk sdk/mesa64/Containerfile
          build mesa-sdk sdk/mesa/Containerfile
          build gtk3-sdk sdk/gtk3/Containerfile
          build gtk4-sdk sdk/gtk4/Containerfile
          build webkitgtk-sdk sdk/webkitgtk/Containerfile
          build desktop-sdk sdk/desktop/Containerfile
          build gtk-sdk sdk/gtk/Containerfile
          test "$(podman image inspect --format '{{json .RootFS.Layers}}' ghcr.io/containerpak/desktop-sdk:main)" = \
            "$(podman image inspect --format '{{json .RootFS.Layers}}' ghcr.io/containerpak/gtk-sdk:main)"

      - name: Publish SDK images
        shell: bash
        run: |
          set -euo pipefail
          source platform/ubuntu.env

          images=(base-sdk mesa64-sdk mesa-sdk gtk3-sdk gtk4-sdk webkitgtk-sdk desktop-sdk gtk-sdk)
          revision="sha-${GITHUB_SHA::12}"
          release="ubuntu-$PLATFORM_VERSION"

          for image in "${images[@]}"; do
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:$revision"
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:$release"
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:ubuntu-26.04"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:$revision"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:$release"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:ubuntu-26.04"
          done

          for image in "${images[@]}"; do
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:main"
          done
