name: Build and publish

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'common/**'
      - 'platform/**'
      - 'sdk/**'
  schedule:
    - cron: '0 3 * * 1'

env:
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      options: --privileged

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Login to GHCR
        run: echo "${{ env.REGISTRY_PASSWORD }}" | podman login ghcr.io --username "${{ env.REGISTRY_USER }}" --password-stdin

      - name: Build platform images
        shell: bash
        run: |
          set -euo pipefail

          build() {
            podman build --format oci --pull=never --file "$2" --tag "ghcr.io/containerpak/$1:main" .
          }

          podman pull docker.io/library/ubuntu:26.04
          build base platform/base/Containerfile
          build mesa64 platform/mesa64/Containerfile
          build mesa-multilib platform/mesa-multilib/Containerfile
          build mesa platform/mesa/Containerfile
          build gtk3 platform/gtk3/Containerfile
          build gtk4 platform/gtk4/Containerfile
          build adwaita platform/adwaita/Containerfile
          build webkitgtk platform/webkitgtk/Containerfile
          build webkitgtk6 platform/webkitgtk6/Containerfile
          build gtk platform/gtk/Containerfile

      - name: Publish platform images
        shell: bash
        run: |
          set -euo pipefail

          images=(base mesa64 mesa-multilib mesa gtk3 gtk4 adwaita webkitgtk webkitgtk6 gtk)
          revision="sha-${GITHUB_SHA::12}"

          for image in "${images[@]}"; do
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:$revision"
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:ubuntu-26.04"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:$revision"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:ubuntu-26.04"
          done

          for image in "${images[@]}"; do
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:main"
          done

  sdk:
    needs: platform
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      options: --privileged

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Login to GHCR
        run: echo "${{ env.REGISTRY_PASSWORD }}" | podman login ghcr.io --username "${{ env.REGISTRY_USER }}" --password-stdin

      - name: Build SDK images
        shell: bash
        run: |
          set -euo pipefail

          build() {
            podman build --format oci --pull=never --file "$2" --tag "ghcr.io/containerpak/$1:main" .
          }

          podman pull ghcr.io/containerpak/base:main
          build base-sdk sdk/base/Containerfile
          build mesa64-sdk sdk/mesa64/Containerfile
          build mesa-sdk sdk/mesa/Containerfile
          build gtk3-sdk sdk/gtk3/Containerfile
          build gtk4-sdk sdk/gtk4/Containerfile
          build webkitgtk-sdk sdk/webkitgtk/Containerfile
          build gtk-sdk sdk/gtk/Containerfile

      - name: Publish SDK images
        shell: bash
        run: |
          set -euo pipefail

          images=(base-sdk mesa64-sdk mesa-sdk gtk3-sdk gtk4-sdk webkitgtk-sdk gtk-sdk)
          revision="sha-${GITHUB_SHA::12}"

          for image in "${images[@]}"; do
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:$revision"
            podman tag "ghcr.io/containerpak/$image:main" "ghcr.io/containerpak/$image:ubuntu-26.04"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:$revision"
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:ubuntu-26.04"
          done

          for image in "${images[@]}"; do
            podman push --format oci --compression-format zstd:chunked --force-compression "ghcr.io/containerpak/$image:main"
          done
